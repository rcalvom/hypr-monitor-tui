name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Rust checks and simulated compositor tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libcairo2-dev fonts-dejavu-core
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint all targets
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run unit tests
        run: cargo test --locked
      - name: Build test binary
        run: cargo build --locked
      - name: Run process and terminal integration tests
        run: python3 tests/process-smoke.py
      - name: Build release binary
        run: cargo build --release --locked
