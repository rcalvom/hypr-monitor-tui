[package]
name = "hypr-monitor-tui"
version = "0.1.0"
edition = "2024"
description = "Keyboard-driven monitor layout editor for Hyprland"
license = "MIT"
repository = "https://github.com/rcalvom/hypr-monitor-tui"

[dependencies]
anyhow = "1"
crossterm = "0.29"
libc = "0.2"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
